[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runanchor"
version = "0.1.0"
description = "Verification and approval gate for coding-agent runs"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
runanchor = "runanchor.cli:main"

[tool.setuptools]
package-dir = { "" = "app" }

[tool.setuptools.packages.find]
where = ["app"]
include = ["runanchor*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]
